<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Harness</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; }

.sidebar { width: 260px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
.sidebar-header { padding: 16px; border-bottom: 1px solid #334155; }
.sidebar-header h2 { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
#new-session-btn { width: 100%; padding: 8px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
#new-session-btn:hover { background: #2563eb; }
.session-list { flex: 1; overflow-y: auto; padding: 8px; }
.session-item { padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; font-size: 13px; color: #cbd5e1; }
.session-item:hover { background: #334155; }
.session-item.active { background: #334155; color: white; }
.session-item .time { font-size: 11px; color: #64748b; }

.main { flex: 1; display: flex; flex-direction: column; }
.chat-header { padding: 12px 20px; border-bottom: 1px solid #334155; font-size: 14px; color: #94a3b8; }
.chat-messages { flex: 1; overflow-y: auto; padding: 20px; }
.message { margin-bottom: 16px; max-width: 85%; }
.message.user { margin-left: auto; }
.message.user .bubble { background: #3b82f6; color: white; border-radius: 12px 12px 4px 12px; padding: 10px 14px; }
.message.assistant .bubble { background: #1e293b; border: 1px solid #334155; border-radius: 12px 12px 12px 4px; padding: 10px 14px; }
.message .bubble { font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }

.step-tool { background: #1a1a2e; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin: 8px 0; font-size: 12px; }
.step-tool .label { color: #f59e0b; font-weight: 600; margin-bottom: 4px; }
.step-tool pre { background: #0f172a; padding: 8px; border-radius: 4px; overflow-x: auto; color: #a5b4fc; font-size: 12px; max-height: 200px; overflow-y: auto; }
.step-thinking { color: #94a3b8; font-style: italic; margin: 4px 0; font-size: 13px; }
.step-error { color: #f87171; font-weight: 600; }

.approval-box { background: #1e293b; border: 2px solid #f59e0b; border-radius: 8px; padding: 14px; margin: 8px 0; }
.approval-box h4 { color: #f59e0b; margin-bottom: 8px; font-size: 13px; }
.approval-box pre { background: #0f172a; padding: 8px; border-radius: 4px; font-size: 12px; color: #e2e8f0; max-height: 300px; overflow-y: auto; margin-bottom: 10px; }
.approval-btns { display: flex; gap: 8px; }
.btn-approve { padding: 6px 16px; background: #22c55e; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
.btn-reject { padding: 6px 16px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }

.chat-input { padding: 16px 20px; border-top: 1px solid #334155; display: flex; gap: 8px; }
.chat-input input { flex: 1; padding: 10px 14px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 14px; outline: none; }
.chat-input input:focus { border-color: #3b82f6; }
.chat-input button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
.chat-input button:disabled { background: #475569; cursor: not-allowed; }

.loading { display: inline-block; }
.loading::after { content: ''; display: inline-block; width: 12px; height: 12px; border: 2px solid #3b82f6; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>Sessions</h2>
    <button id="new-session-btn">+ 새 세션</button>
  </div>
  <div class="session-list" id="session-list"></div>
</div>

<div class="main">
  <div class="chat-header" id="chat-header">세션을 선택하거나 새로 만드세요</div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-input">
    <input type="text" id="msg-input" placeholder="메시지를 입력하세요..." disabled>
    <button id="send-btn" disabled>전송</button>
  </div>
</div>

<script>
let currentSession = null;
let sending = false;

const msgInput = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const chatMessages = document.getElementById('chat-messages');
const chatHeader = document.getElementById('chat-header');
const sessionList = document.getElementById('session-list');

async function loadSessions() {
  const res = await fetch('/api/sessions');
  const sessions = await res.json();
  sessionList.innerHTML = '';
  sessions.forEach(s => {
    const div = document.createElement('div');
    div.className = 'session-item' + (currentSession === s.session_id ? ' active' : '');
    div.innerHTML = `<div>${s.preview || '(빈 세션)'}</div><div class="time">${s.updated_at.slice(0, 16)}</div>`;
    div.onclick = () => selectSession(s.session_id);
    sessionList.appendChild(div);
  });
}

async function selectSession(sid) {
  currentSession = sid;
  chatHeader.textContent = `세션: ${sid}`;
  msgInput.disabled = false;
  sendBtn.disabled = false;
  const res = await fetch(`/api/sessions/${sid}`);
  const data = await res.json();
  chatMessages.innerHTML = '';
  data.conversation.forEach(msg => {
    if (msg.content.startsWith('[도구 실행 결과]') || msg.content.startsWith('[사용자 거절]')) return;
    addMessage(msg.role, msg.content);
  });
  chatMessages.scrollTop = chatMessages.scrollHeight;
  loadSessions();
}

async function newSession() {
  const res = await fetch('/api/sessions', { method: 'POST' });
  const data = await res.json();
  await loadSessions();
  await selectSession(data.session_id);
}

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  div.appendChild(bubble);
  chatMessages.appendChild(div);
}

function renderSteps(steps) {
  steps.forEach(step => {
    if (step.type === 'answer') {
      addMessage('assistant', step.content);
    } else if (step.type === 'thinking') {
      const div = document.createElement('div');
      div.className = 'step-thinking';
      div.textContent = step.content;
      chatMessages.appendChild(div);
    } else if (step.type === 'tool_call') {
      const div = document.createElement('div');
      div.className = 'step-tool';
      div.innerHTML = `<div class="label">🔧 ${step.name}</div><pre>${JSON.stringify(step.args, null, 2)}</pre>`;
      chatMessages.appendChild(div);
    } else if (step.type === 'tool_result') {
      const div = document.createElement('div');
      div.className = 'step-tool';
      const text = step.result.error ? `오류: ${step.result.error}` : JSON.stringify(step.result, null, 2);
      div.innerHTML = `<div class="label">📋 결과</div><pre>${escapeHtml(text)}</pre>`;
      chatMessages.appendChild(div);
    } else if (step.type === 'approval_needed') {
      renderApproval(step);
    } else if (step.type === 'rejected') {
      const div = document.createElement('div');
      div.className = 'step-error';
      div.textContent = `❌ ${step.tool_name} 실행이 거절되었습니다.`;
      chatMessages.appendChild(div);
    } else if (step.type === 'error') {
      const div = document.createElement('div');
      div.className = 'step-error';
      div.textContent = step.content;
      chatMessages.appendChild(div);
    }
  });
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function renderApproval(step) {
  const box = document.createElement('div');
  box.className = 'approval-box';
  const argsText = step.tool_name === 'write_file'
    ? `파일: ${step.tool_args.path}\n\n${step.tool_args.content || ''}`
    : JSON.stringify(step.tool_args, null, 2);
  box.innerHTML = `
    <h4>⚠️ ${step.tool_name} 승인 필요</h4>
    <pre>${escapeHtml(argsText)}</pre>
    <div class="approval-btns">
      <button class="btn-approve" onclick="handleApproval('${step.approval_id}', true, this)">승인</button>
      <button class="btn-reject" onclick="handleApproval('${step.approval_id}', false, this)">거절</button>
    </div>`;
  chatMessages.appendChild(box);
}

async function handleApproval(approvalId, approved, btn) {
  btn.parentElement.innerHTML = approved ? '<span style="color:#22c55e">✅ 승인됨</span>' : '<span style="color:#ef4444">❌ 거절됨</span>';
  const res = await fetch('/api/approve', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ approval_id: approvalId, approved }),
  });
  const data = await res.json();
  renderSteps(data.steps || []);
}

async function sendMessage() {
  const msg = msgInput.value.trim();
  if (!msg || !currentSession || sending) return;
  sending = true;
  sendBtn.disabled = true;
  addMessage('user', msg);
  msgInput.value = '';

  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'message assistant';
  loadingDiv.innerHTML = '<div class="bubble"><span class="loading">처리 중</span></div>';
  chatMessages.appendChild(loadingDiv);
  chatMessages.scrollTop = chatMessages.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: currentSession, message: msg }),
    });
    loadingDiv.remove();
    const data = await res.json();
    renderSteps(data.steps || []);
  } catch (e) {
    loadingDiv.remove();
    addMessage('assistant', `[오류] ${e.message}`);
  }
  sending = false;
  sendBtn.disabled = false;
  msgInput.focus();
  loadSessions();
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

sendBtn.onclick = sendMessage;
msgInput.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
document.getElementById('new-session-btn').onclick = newSession;

loadSessions();
</script>
</body>
</html>
